name: Publicar Lote Certo

# Publica a versão comercial (pasta comercial/) no projeto Firebase lote-certo-2ec77.
# Não mexe no site da Fazenda São João.
on:
  push:
    branches: [main]
    paths: ["comercial/**", ".github/workflows/publicar-lote-certo.yml"]
  workflow_dispatch:

concurrency:
  group: publicar-lote-certo
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar em lote-certo-2ec77.web.app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: comercial
    env:
      CONTA_DE_SERVICO: ${{ secrets.LOTE_CERTO_SERVICE_ACCOUNT }}
      EMAIL_ADMIN: ${{ secrets.LOTE_CERTO_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir os segredos
        run: |
          if [ -z "$CONTA_DE_SERVICO" ] || [ -z "$EMAIL_ADMIN" ]; then
            echo "::error::Faltam os segredos LOTE_CERTO_SERVICE_ACCOUNT e LOTE_CERTO_ADMIN_EMAIL no repositório."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: comercial/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Colocar o e-mail do administrador nas regras
        run: |
          EMAIL=$(printf '%s' "$EMAIL_ADMIN" | tr 'A-Z' 'a-z' | tr -d ' \n\r')
          sed -i "s/SEU_EMAIL@gmail.com/$EMAIL/" firestore.rules
          ! grep -q "SEU_EMAIL" firestore.rules
      - name: Publicar site, sistema e regras do banco
        run: |
          printf '%s' "$CONTA_DE_SERVICO" > "$RUNNER_TEMP/conta.json"
          echo "Conta usada na publicação (é ela que precisa dos papéis no IAM): $(node -e 'const c=require(process.argv[1]);console.log(c.client_email.split("@")[0]+" @ "+c.project_id)' "$RUNNER_TEMP/conta.json")"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta.json" \
            npx --yes firebase-tools@13 deploy --only hosting,firestore:rules --project lote-certo-2ec77 --non-interactive
          rm -f "$RUNNER_TEMP/conta.json"
